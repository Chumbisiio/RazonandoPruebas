spring.application.name=Razonando-Back
spring.config.import=optional:classpath:application-local.properties

spring.jpa.hibernate.ddl-auto=validate

spring.datasource.url=${DATABASE_URL_POOLED}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

## Flyway migrations connection.
spring.flyway.url=${DATABASE_URL_DIRECT}
spring.flyway.user=${DATABASE_USERNAME}
spring.flyway.password=${DATABASE_PASSWORD}

## JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

## CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
